name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */5 * *'  # ทุก 5 วัน เวลา 08:00 UTC
  workflow_dispatch:        # กด run เองได้ด้วย

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping website
        run: curl -s -o /dev/null -w "%{http_code}" https://medstock-his.vercel.app/
